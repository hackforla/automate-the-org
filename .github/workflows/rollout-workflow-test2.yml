name: 'Automated Central Workflow Rollout- TEST 2'

on:
  workflow_dispatch:
    inputs:
      target_repos:
        description: 'Newline-separated list of target repositories (e.g., org/repo-B)'
        required: true
        default: 'org/repo-B' 
      dry_run:
        description: 'If true, runs all steps except commit, push, and PR creation. Default: true'
        required: true
        type: boolean
        default: true

jobs:
  # 1. Job to parse the multi-line input into a JSON array for the matrix
  parse_inputs:
    runs-on: ubuntu-latest
    outputs:
      repo_matrix: ${{ steps.prepare.outputs.repos }} # Pass the output to the next job
    steps:
      - name: 📝 Prepare Matrix List from Input
        id: prepare
        run: |
          # Use the 'jq' tool (pre-installed on runners) to format the multiline input as a JSON array.
          # The 'tr' command replaces newlines (\n) with spaces first, then jq processes it.
          REPOS_JSON=$(echo "${{ github.event.inputs.target_repos }}" | tr '\n' ' ' | jq -R 'split(" ") | map(select(length > 0))')
          
          # Set the output variable
          echo "repos=$REPOS_JSON" >> $GITHUB_OUTPUT
          echo "Matrix input prepared: $REPOS_JSON"

  # 2. The main rollout job, now dependent on the parser job
  rollout:
    runs-on: ubuntu-latest
    needs: parse_inputs # Wait for the parsing job to finish
    
    strategy:
      fail-fast: false
      matrix:
        # Consume the JSON output from the previous job
        target_repo: ${{ fromJson(needs.parse_inputs.outputs.repo_matrix) }}

    # Use the current matrix item as the environment variable
    env:
      TARGET_REPO: ${{ matrix.target_repo }}
      ROLLOUT_BRANCH: 'automation/rollout-central-workflow'
      PR_TEMPLATE_PATH: '.github/templates/pr_template_add_update.md'
      
    steps:
      - name: ⬇️ Checkout Source Repository (Repo A)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      # Log the dry_run status at the start of the job
      - name: 📝 Log Dry Run Status
        run: |
          echo "Processing target repository: ${{ env.TARGET_REPO }}"
          if ${{ github.event.inputs.dry_run }}; then
            echo "--- DRY RUN MODE: No changes will be committed or pushed. ---"
          else
            echo "--- LIVE RUN MODE: Changes WILL be committed, pushed, and a PR created. ---"
          fi

      # 1. Extract WORKFLOW_NAME dynamically
      - name: 🏷️ Extract Workflow Name
        id: get_name
        run: |
          WORKFLOW_FILE_PATH="../../example-configs/add-update-label-weekly.example.yml"
          WORKFLOW_NAME=$(grep '^name:' "$WORKFLOW_FILE_PATH" | head -n 1 | sed 's/^name: *//')
          
          if [ -z "$WORKFLOW_NAME" ]; then
            echo "::error::Could not extract workflow name from $WORKFLOW_FILE_PATH"
            exit 1
          fi
          
          echo "workflow_name=$WORKFLOW_NAME" >> $GITHUB_OUTPUT

      # 2. Generate a token for the target repo using the GitHub App credentials
      - name: ⚙️ Get Target Repository App Token
        id: get_token
        uses: actions/github-script@v7
        with:
          script: |
            const { App } = await import('@octokit/app');
            const appId = ${{ secrets.APP_ID }};
            const privateKey = Buffer.from(${{ secrets.PRIVATE_KEY }}, 'base64').toString('utf8');
            const targetRepo = process.env.TARGET_REPO;
            
            const app = new App({ appId, privateKey });
            const [owner, repo] = targetRepo.split('/');
            const installation = await app.octokit.rest.apps.getRepoInstallation({ owner, repo });
            const installationId = installation.data.id;

            const octokit = await app.getInstallationOctokit(installationId);
            const tokenResponse = await octokit.rest.apps.createInstallationAccessToken({ installation_id: installationId });
            
            core.setOutput('token', tokenResponse.data.token);
            
      # 3. Read the PR template and extract necessary file paths
      - name: 📝 Parse PR Template and Get File Paths
        id: parse_template
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await core.group('Install js-yaml', async () => {
              const exec = require('child_process').exec;
              await new Promise((resolve, reject) => {
                exec('npm install js-yaml', (error, stdout, stderr) => {
                  if (error) return reject(error);
                  resolve();
                });
              });
            });
            const yaml = require('js-yaml');
            
            const templatePath = process.env.PR_TEMPLATE_PATH;
            const templateContent = fs.readFileSync(templatePath, 'utf8');
            
            const regex = //s;
            const match = templateContent.match(regex);
            
            if (!match || match.length < 2) {
              throw new Error("Could not find the YAML configuration block in the PR template.");
            }
            
            const yamlContent = match[1].trim();
            const config = yaml.load(yamlContent);
            
            const allFiles = [];
            if (config.workflow_file) {
              allFiles.push(config.workflow_file);
            }
            if (config.config_files) {
              allFiles.push(...config.config_files);
            }
            
            fs.writeFileSync('pr_body_temp.md', templateContent);
            
            core.setOutput('files_config', JSON.stringify(allFiles));
            core.setOutput('pr_body_file', 'pr_body_temp.md'); 
            
      # 4. Checkout Target Repository, Create Branch, and Set User
      - name: ⬇️ Setup Target Repo (${{ env.TARGET_REPO }})
        run: |
          # Use the token for git clone
          git clone "https://x-access-token:${{ steps.get_token.outputs.token }}@github.com/${{ env.TARGET_REPO }}.git" target_repo
          
          cd target_repo
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
          # Create and switch to the rollout branch
          git switch -c ${{ env.ROLLOUT_BRANCH }}

      # 5. Copy files from source (Repo A root) to destination (Repo B root inside target_repo)
      - name: 📂 Copy Files to Target Repo
        run: |
          CONFIG='${{ steps.parse_template.outputs.files_config }}'
          
          echo "$CONFIG" | jq -r '.[] | .src + " " + .dest' | while read -r line ; do
              SRC_FILE=$(echo "$line" | awk '{print $1}')
              DEST_FILE=$(echo "$line" | awk '{print $2}')
              
              echo "Copying $SRC_FILE to target_repo/$DEST_FILE"
              mkdir -p ./target_repo/$(dirname "$DEST_FILE")
              cp -f "$SRC_FILE" "./target_repo/$DEST_FILE"
          done
        
      # 6. Commit, Push, and Create PR (Only if dry_run is false)
      - name: 💾 Commit, Push, and Create PR
        if: ${{ github.event.inputs.dry_run == false }}
        id: create_pr
        env:
          # Set the token for gh CLI
          GITHUB_TOKEN: ${{ steps.get_token.outputs.token }}
          
        run: |
          cd target_repo
          git add .
          
          if git status --porcelain | grep -q . ; then
            # 1. COMMIT
            WORKFLOW_NAME="${{ steps.get_name.outputs.workflow_name }}"
            COMMIT_MESSAGE="Install ${WORKFLOW_NAME} and project-specific files"
            echo "Committing with message: $COMMIT_MESSAGE"
            git commit -m "$COMMIT_MESSAGE"
            
            # 2. PUSH
            echo "Pushing branch ${{ env.ROLLOUT_BRANCH }} to ${{ env.TARGET_REPO }}"
            git push origin HEAD:${{ env.ROLLOUT_BRANCH }} --force
            
            # 3. GET DEFAULT BRANCH (BASE)
            DEFAULT_BRANCH=$(GH_REPO=${{ env.TARGET_REPO }} gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)
            echo "Base branch detected: $DEFAULT_BRANCH"

            # 4. CREATE PULL REQUEST
            PR_TITLE="Install workflow: ${WORKFLOW_NAME}"
            echo "Creating Pull Request with title: $PR_TITLE"
            
            gh pr create \
              --repo ${{ env.TARGET_REPO }} \
              --head "${{ env.ROLLOUT_BRANCH }}" \
              --base "$DEFAULT_BRANCH" \
              --title "$PR_TITLE" \
              --body-file "${{ steps.parse_template.outputs.pr_body_file }}" \
              --label 'automation' 
              
            echo "changes_made=true" >> $GITHUB_OUTPUT
          else
            echo "No file changes detected after copy. Skipping commit and PR creation."
            echo "changes_made=false" >> $GITHUB_OUTPUT
          fi

      - name: 🛑 Dry Run Final Check
        if: ${{ github.event.inputs.dry_run == true }}
        run: echo "Successfully completed dry run for ${{ env.TARGET_REPO }}. No changes were pushed or PRs created."
